spring:
  application:
    name: url-shortener

  datasource:
    # Render (and most PaaS providers) inject DATABASE_URL, DB_USERNAME, DB_PASSWORD
    # as environment variables - never hardcode real credentials here.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    capacity: 1000          # max hot URLs held in the in-memory LRU cache
  rate-limit:
    capacity: 10             # max short-URL creations per window
    refill-per-minute: 10     # tokens added back per minute
  default-expiry-days: 365      # if the caller doesn't specify one
